name: Send daily newsletter

on:
  schedule:
    # 8:00 AM Indian Standard Time is 2:30 AM UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-daily-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore sent history
        uses: actions/cache@v5
        with:
          path: sent_history.json
          key: newsletter-history-${{ github.run_id }}
          restore-keys: |
            newsletter-history-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create subscriber CSV
        env:
          NEWSLETTER_SUBSCRIBERS_CSV: ${{ secrets.NEWSLETTER_SUBSCRIBERS_CSV }}
        run: |
          if [ -z "$NEWSLETTER_SUBSCRIBERS_CSV" ]; then
            echo "::error::Missing NEWSLETTER_SUBSCRIBERS_CSV secret. Add CSV content with an email column, for example: email,name"
            exit 1
          fi
          printf '%s\n' "$NEWSLETTER_SUBSCRIBERS_CSV" > subscribers.csv

      - name: Send newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUBSCRIBERS_CSV: subscribers.csv
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_MAX_OUTPUT_TOKENS: "9600"
          GEMINI_SUMMARY_OUTPUT_TOKENS: "768"
          GEMINI_RETRY_ATTEMPTS: "3"
          GEMINI_RETRY_DELAY_SECONDS: "2"
          MAX_ITEMS_PER_FEED: "10"
          MAX_CANDIDATES_FOR_AI: "40"
          MAX_STORIES_PER_SOURCE: "2"
          NEWSLETTER_STORY_COUNT: "8"
          MAX_STORY_AGE_HOURS: "24"
          MIN_STORIES_TO_SEND: "3"
          SENT_HISTORY_FILE: sent_history.json
          SENT_HISTORY_DAYS: "45"
        run: python fresh_newsletter_agent.py
